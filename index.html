<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aloha Tic-Tac-Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="waves"></div>

  <main>
    <h1>🌺 Aloha Tic-Tac-Toe 🌴</h1>

    <div class="mode-select">
      <label class="mode-option">
        <input type="radio" name="mode" value="2player" checked />
        Two Player
      </label>
      <label class="mode-option">
        <input type="radio" name="mode" value="computer" />
        Vs Computer
      </label>
    </div>

    <div class="level-select" id="levelSelect" role="radiogroup" aria-label="Computer difficulty" hidden>
      <span class="level-label">Level</span>
      <label class="level-option">
        <input type="radio" name="level" value="1" />
        <span>1</span>
      </label>
      <label class="level-option">
        <input type="radio" name="level" value="2" />
        <span>2</span>
      </label>
      <label class="level-option">
        <input type="radio" name="level" value="3" checked />
        <span>3</span>
      </label>
      <label class="level-option">
        <input type="radio" name="level" value="4" />
        <span>4</span>
      </label>
      <label class="level-option">
        <input type="radio" name="level" value="5" />
        <span>5</span>
      </label>
    </div>
    <p class="level-caption" id="levelCaption" hidden>Medium — a fair challenge</p>

    <p id="status">Palm Tree's turn</p>

    <div id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <button id="reset">🐚 Restart Game 🐚</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
