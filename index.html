<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aloha Tic-Tac-Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="waves"></div>

  <main>
    <h1>🌺 Aloha Tic-Tac-Toe 🌴</h1>

    <div class="mode-select">
      <label class="mode-option">
        <input type="radio" name="mode" value="2player" checked />
        Two Player
      </label>
      <label class="mode-option">
        <input type="radio" name="mode" value="computer" />
        Vs Computer
      </label>
    </div>

    <p id="status">Palm Tree's turn</p>

    <div id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <button id="reset">🐚 Restart Game 🐚</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
